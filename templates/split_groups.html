{% extends 'base.html' %}
{% block title %}Split Groups{% endblock %}
{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Money Split Groups</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Create Group</div>
                <div class="card-body">
                    <form method="post">{% csrf_token %}
                        {{ form.as_p }}
                        <button class="btn btn-primary" type="submit">Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="list-group">
                {% for group in groups %}
                    <a class="list-group-item list-group-item-action" href="{% url 'split_group_detail' group.id %}">
                        <strong>{{ group.name }}</strong> - {{ group.currency }}
                    </a>
                {% empty %}
                    <div class="alert alert-info">No groups yet.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
